name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware and gesture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build C152 firmware
        run: pio run -e m5stack-stopwatch
      - name: Test swipe classification
        run: |
          c++ -std=c++17 -Iinclude simulator/gesture_test.cpp -o /tmp/gesture-test
          /tmp/gesture-test

  companion:
    name: macOS companion
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release companion
        run: swift build --package-path companion -c release
